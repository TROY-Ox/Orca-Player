# ORCA Player: builds signed release files when a version tag such as v0.2.0 is pushed,
# and publishes the public ones (standard APK, standard AAB, SHA256SUMS.txt) as a GitHub Release. Can also rebuild an existing tag by hand.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build again, for example v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # needed to create the GitHub Release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Version name and code from the tag
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $TAG must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( 10#$minor > 99 || 10#$patch > 99 )); then
            echo "::error::Minor and patch numbers must be below 100"
            exit 1
          fi
          code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
          if (( code < 1 )); then
            echo "::error::v0.0.0 is not a valid release"
            exit 1
          fi
          {
            echo "VERSION_NAME=${TAG#v}"
            echo "VERSION_CODE=$code"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore the signing key
        env:
          ORCA_KEYSTORE_BASE64: ${{ secrets.ORCA_KEYSTORE_BASE64 }}
          ORCA_KEYSTORE_PASSWORD: ${{ secrets.ORCA_KEYSTORE_PASSWORD }}
          ORCA_KEY_ALIAS: ${{ secrets.ORCA_KEY_ALIAS }}
          ORCA_KEY_PASSWORD: ${{ secrets.ORCA_KEY_PASSWORD }}
        run: |
          # Final releases (v1.0.0 and later, without a suffix) must use the real key: all four secrets.
          if [[ "$TAG" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            for name in ORCA_KEYSTORE_BASE64 ORCA_KEYSTORE_PASSWORD ORCA_KEY_ALIAS ORCA_KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::Secret $name is missing. Add all four signing secrets before a final release."
                exit 1
              fi
            done
          fi
          if [ -z "$ORCA_KEYSTORE_BASE64" ]; then
            # Until the owner adds the real key, sign with the committed TEST key (app/test-release.keystore).
            # Test-signed builds can't be updated to real-key builds without uninstalling first.
            echo "::warning::ORCA_KEYSTORE_BASE64 is not set, so this release is signed with the TEST key"
            echo "ORCA_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/test-release.keystore" >> "$GITHUB_ENV"
            echo "ORCA_TEST_KEY=true" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$ORCA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orca-release.jks"
          echo "ORCA_KEYSTORE_PATH=$RUNNER_TEMP/orca-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs and AAB
        env:
          ORCA_KEYSTORE_PASSWORD: ${{ secrets.ORCA_KEYSTORE_PASSWORD }}
          ORCA_KEY_ALIAS: ${{ secrets.ORCA_KEY_ALIAS }}
          ORCA_KEY_PASSWORD: ${{ secrets.ORCA_KEY_PASSWORD }}
        run: >
          ./gradlew
          test :app:checkStandardLicences
          :app:assembleStandardRelease :app:assembleExtendedRelease :app:bundleStandardRelease
          -Porca.versionCode="$VERSION_CODE"
          -Porca.versionName="$VERSION_NAME"

      - name: Check signatures and 16 KB alignment
        run: |
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/*/release/*.apk; do
            case "$apk" in
              *-unsigned.apk) echo "::error::$apk is not signed"; exit 1 ;;
            esac
            "$bt/apksigner" verify --print-certs "$apk"
          done
          bash scripts/check-16kb.sh app/build/outputs/apk/*/release/*.apk

      # The repository is public. The public release gets only the standard APK, the standard AAB
      # and SHA256SUMS.txt. The extended APK (GPL, sideload only) and the R8 mapping files stay in
      # a workflow artifact for 3 days.
      - name: Collect the release files
        run: |
          mkdir -p dist private
          cp app/build/outputs/apk/standard/release/*.apk "dist/ORCA-Player-standard-$TAG.apk"
          cp app/build/outputs/bundle/standardRelease/*.aab "dist/ORCA-Player-standard-$TAG.aab"
          (cd dist && sha256sum -- *.apk *.aab > SHA256SUMS.txt)
          cp app/build/outputs/apk/extended/release/*.apk "private/ORCA-Player-extended-$TAG.apk"
          if [ -d app/build/outputs/mapping ]; then
            (cd app/build/outputs/mapping && zip -qr "$GITHUB_WORKSPACE/private/ORCA-Player-mapping-$TAG.zip" .)
          fi
          (cd private && sha256sum -- * > SHA256SUMS-private.txt)
          ls dist
          test "$(ls dist | wc -l)" -eq 3

      - name: Keep the extended APK and mapping files as a 3-day artifact
        uses: actions/upload-artifact@v7
        with:
          name: orca-private-${{ env.TAG }}
          path: private/
          retention-days: 3
          if-no-files-found: error

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$TAG.md"
          args=(--title "ORCA Player $TAG")
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          case "$TAG" in
            v0.*|*-*) args+=(--prerelease) ;;
          esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Drop any file that isn't one of the three public ones (for example from an older run).
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              [ -f "dist/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" dist/ORCA-Player-standard-"$TAG".apk dist/ORCA-Player-standard-"$TAG".aab dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/ORCA-Player-standard-"$TAG".apk dist/ORCA-Player-standard-"$TAG".aab dist/SHA256SUMS.txt --verify-tag "${args[@]}"
          fi

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/orca-release.jks"
