# ORCA Player: checks every pull request and every push to main.
# Pushes to main also refresh the "Latest debug build" pre-release with fresh APKs.
name: CI

on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # used only by the "Publish latest debug build" step on main
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (also validates the Gradle wrapper)
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint, licence check and debug APKs
        run: >
          ./gradlew --continue
          test
          :app:lintStandardDebug :app:lintExtendedDebug
          :app:checkStandardLicences
          :app:assembleStandardDebug :app:assembleExtendedDebug
          -Porca.versionCode=${{ github.run_number }}
          -Porca.versionName=0.0.0-ci.${{ github.run_number }}

      - name: 16 KB page size check
        run: >
          bash scripts/check-16kb.sh
          app/build/outputs/apk/standard/debug/*.apk
          app/build/outputs/apk/extended/debug/*.apk

      - name: Upload reports if something failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Publish latest debug build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/debug/*.apk dist/ORCA-Player-standard-debug.apk
          cp app/build/outputs/apk/extended/debug/*.apk dist/ORCA-Player-extended-debug.apk
          if ! gh release view latest-debug > /dev/null 2>&1; then
            gh release create latest-debug --prerelease --target "$GITHUB_SHA" \
              --title "Latest debug build" --notes "Created by CI."
          fi
          git tag -f latest-debug "$GITHUB_SHA"
          git push -f origin refs/tags/latest-debug
          gh release upload latest-debug dist/*.apk --clobber
          gh release edit latest-debug --notes "Debug build of commit $GITHUB_SHA, made $(date -u '+%Y-%m-%d %H:%M') UTC. For testing only, not for sharing. On a phone, install ORCA-Player-standard-debug.apk."
