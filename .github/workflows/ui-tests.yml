# ORCA Player: instrumented tests on Android emulators, weekly and on demand.
# One normal Android 16 emulator, and one 16 KB page size emulator.
name: UI tests

on:
  schedule:
    - cron: '23 1 * * 0' # Sundays 01:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: API ${{ matrix.api-level }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 36
            target: google_apis
          - api-level: 35
            target: google_apis_ps16k # 16 KB page size image
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and test APKs
        run: ./gradlew :app:assembleStandardDebug :app:assembleStandardDebugAndroidTest

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedStandardDebugAndroidTest connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports-api${{ matrix.api-level }}-${{ matrix.target }}
          path: '**/build/reports/androidTests/'
          retention-days: 3
          if-no-files-found: ignore
